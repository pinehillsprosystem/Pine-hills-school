<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date Sheet & Syllabus - Pine Hills School</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .syllabus-container { padding: 40px 0; }
        .back-btn { display: inline-block; margin-bottom: 20px; color: var(--primary-blue); text-decoration: none; font-weight: 600; }
        .back-btn:hover { color: var(--dark-blue); }
        
        .content-box { background: var(--light-gray); padding: 30px; border-radius: 10px; margin-bottom: 40px; border: 1px solid rgba(0,0,0,0.05); }
        .content-box h2 { color: var(--dark-blue); margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
        
        /* Class Selector Styling */
        .selector-box { background: var(--pure-white); padding: 20px; border-radius: 8px; border: 1px solid #e6f0fa; margin-bottom: 25px; display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        .selector-box label { font-weight: 600; color: var(--dark-blue); font-size: 16px; }
        .class-select { padding: 10px 15px; border: 2px solid var(--light-blue); border-radius: 6px; font-size: 16px; outline: none; min-width: 200px; color: #333; cursor: pointer; }
        .class-select:focus { border-color: var(--primary-blue); }

        /* Table Styling */
        .custom-table { width: 100%; border-collapse: collapse; margin-top: 15px; background: var(--pure-white); border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .custom-table th, .custom-table td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #e6f0fa; }
        .custom-table th { background-color: var(--primary-blue); color: var(--pure-white); font-weight: 600; }
        .custom-table tr:hover { background-color: var(--light-blue); }

        /* Dynamic Heading Alert */
        .current-class-heading { font-size: 18px; font-weight: 700; color: var(--primary-blue); margin-top: 10px; display: inline-block; background: #e6f0fa; padding: 5px 15px; border-radius: 20px; }

        /* 📱 Mobile Responsive CSS (No Scroll Card System) */
        @media (max-width: 650px) {
            .content-box { padding: 15px; }
            .content-box h2 { font-size: 18px; }
            .selector-box { padding: 15px; gap: 10px; }
            .class-select { width: 100%; }

            .custom-table, .custom-table thead, .custom-table tbody, .custom-table th, .custom-table td, .custom-table tr { 
                display: block; 
            }
            .custom-table thead { 
                display: none; /* Mobile par main headers hide ho jayein ge */
            }
            .custom-table tr {
                background: var(--pure-white);
                border: 1px solid #e6f0fa;
                border-radius: 8px;
                margin-bottom: 15px;
                padding: 10px;
                box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            }
            .custom-table td { 
                border: none;
                border-bottom: 1px solid #f4f9ff; 
                position: relative;
                padding-left: 42%; 
                text-align: right;
                font-size: 14px;
            }
            .custom-table td:last-child {
                border-bottom: none;
            }
            /* Label injection for mobile */
            .custom-table td::before { 
                position: absolute;
                left: 10px;
                width: 38%; 
                text-align: left;
                font-weight: 700;
                color: var(--primary-blue);
            }
            .custom-table td:nth-of-type(1)::before { content: "Date & Day"; }
            .custom-table td:nth-of-type(2)::before { content: "Subject"; }
            .custom-table td:nth-of-type(3)::before { content: "Timing"; }
            .custom-table td:nth-of-type(4)::before { content: "Class Room"; }
        }
    </style>
</head>

// Default chalne se pehle check karega ke madam ne admin panel se koi nayi entry to nahi daali

if (adminDS) {
    // Agar admin ne naya data dala hai to default database ko replace/merge kar do
    Object.keys(adminDS).forEach(clsKey => {
        dateSheetDatabase[clsKey] = adminDS[clsKey];
    });
}

        // Date Sheet Render karne ka function
        function loadDateSheet() {
            const selectedClass = document.getElementById("classSelect").value;
            const selectElement = document.getElementById("classSelect");
            const classText = selectElement.options[selectElement.selectedIndex].text;
            
            // Update upper label heading
            document.getElementById("displayClassName").innerText = classText + " Date Sheet";
            
            const tableBody = document.getElementById("dateSheetBody");
            tableBody.innerHTML = ""; // Clear existing records
            
            const schedule = dateSheetDatabase[selectedClass];
            
            if (schedule) {
                schedule.forEach(item => {
                    const row = `<tr>
                        <td><strong>${item.date}</strong></td>
                        <td>${item.subject}</td>
                        <td>${item.time}</td>
                        <td>${item.room}</td>
                    </tr>`;
                    tableBody.innerHTML += row;
                });
            }
        }

        // Default running state when page fires up
        window.onload = function() {
            loadDateSheet();
        };
